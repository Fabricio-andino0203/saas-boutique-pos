# Producción: base de datos + app + Caddy (HTTPS). Siempre con el archivo de variables:
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
# Plantilla del archivo: .env.production.example (compose solo le pasa a la app lo que necesita). La contraseña de la base debe ser apta para una URL (p. ej. `openssl rand -hex 24`).
name: boutique-pos-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?define POSTGRES_USER en .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-boutique_pos}
      TZ: UTC
    # Conexiones simultáneas que admite Postgres (100 de fábrica). Con muchos negocios (TENANCY_MODE=multi) se sube junto con
    # TENANT_POOL_MAX_CONNECTIONS de la app: docs/RUNBOOK.md §17.
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-100}"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: boutique-pos:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Solo lo que la app necesita (nada de la clave de respaldos ni de la contraseña de otros servicios).
    environment:
      NODE_ENV: production
      DEPLOYMENT: ${DEPLOYMENT:-production}
      TZ: ${TZ:-America/Tegucigalpa}
      APP_URL: ${APP_URL:?define APP_URL en .env.production}
      AUTH_SECRET: ${AUTH_SECRET:?define AUTH_SECRET en .env.production}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-boutique_pos}?schema=public
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-20}
      # Carpeta de las fotos de los productos: el volumen `uploads` (más abajo). Es de lo que no se puede reconstruir (RUNBOOK §18).
      UPLOADS_DIR: /data/uploads
      # Opcional: las fotos en un servicio de objetos S3 en vez del volumen (si se define S3_BUCKET, manda sobre la carpeta).
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      # Qué cabecera trae la IP real del cliente: con Caddy (esta pila) la de siempre.
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-x-forwarded-for}
      # Plataforma multi-negocio (docs/SAAS_ETAPA_2.md). Con TENANCY_MODE=single (por omisión) nada de esto se usa.
      TENANCY_MODE: ${TENANCY_MODE:-single}
      PLATFORM_HOST: ${PLATFORM_HOST:-}
      TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN:-}
      TENANT_DIRECTORY_TTL_MS: ${TENANT_DIRECTORY_TTL_MS:-}
      # Cuántas conexiones a Postgres puede tener ESTA instancia hacia los negocios, todas sumadas (60 de fábrica: deja lugar en
      # un Postgres de 100). Siempre menos que POSTGRES_MAX_CONNECTIONS; docs/RUNBOOK.md §17 trae la tabla de valores.
      TENANT_POOL_MAX_CONNECTIONS: ${TENANT_POOL_MAX_CONNECTIONS:-}
      TENANT_POOL_SIZE: ${TENANT_POOL_SIZE:-}
      TENANT_POOL_MAX_ACTIVE: ${TENANT_POOL_MAX_ACTIVE:-}
      PLATFORM_LOGIN_RATE_LIMIT_MAX: ${PLATFORM_LOGIN_RATE_LIMIT_MAX:-10}
      CONTROL_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_CONTROL_DB:-boutique_pos_control}?schema=public
      # Cuenta que crea las bases y roles de los negocios nuevos y las migra (alta automática, Etapa 3).
      TENANT_PROVISIONING_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/postgres
      TENANT_TEMPLATE_DB: ${TENANT_TEMPLATE_DB:-}
      # Solo con PgBouncer (perfil `pgbouncer`, docs/RUNBOOK.md §17): a dónde se conecta la app para atender a los negocios.
      TENANT_DB_HOST: ${TENANT_DB_HOST:-}
      TENANT_DB_PORT: ${TENANT_DB_PORT:-}
      PLATFORM_MASTER_KEY: ${PLATFORM_MASTER_KEY:-}
      PLATFORM_MASTER_KEY_VERSION: ${PLATFORM_MASTER_KEY_VERSION:-1}
      PLATFORM_MASTER_KEY_PREVIOUS: ${PLATFORM_MASTER_KEY_PREVIOUS:-}
      PLATFORM_MASTER_KEY_PREVIOUS_VERSION: ${PLATFORM_MASTER_KEY_PREVIOUS_VERSION:-}
    volumes:
      - uploads:/data/uploads
    expose:
      - "3000"
    logging: *logging

  backup:
    build: ./docker/backup
    image: boutique-pos-backup:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-boutique_pos}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?define BACKUP_PASSPHRASE en .env.production}
      BACKUP_TIME: ${BACKUP_TIME:-02:00}
      # Un negocio sin plan conserva sus respaldos este tiempo; con plan, los días del plan (Planes → Días que se conservan los respaldos).
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      # Cuántos respaldos se hacen a la vez. Uno por uno basta para pocos negocios; con cientos, 4 acortan mucho la ventana.
      BACKUP_PARALLEL: ${BACKUP_PARALLEL:-1}
      # Cuánto se guarda el volcado final de una base archivada (el que se exige antes de borrarla).
      FINAL_BACKUP_RETENTION_DAYS: ${FINAL_BACKUP_RETENTION_DAYS:-365}
      # Cada cuántos segundos revisa si se pidió un respaldo desde el panel.
      BACKUP_POLL_SECONDS: ${BACKUP_POLL_SECONDS:-15}
      # Con varios negocios también se respalda la base CENTRAL de la plataforma (control-*.dump.enc).
      TENANCY_MODE: ${TENANCY_MODE:-single}
      POSTGRES_CONTROL_DB: ${POSTGRES_CONTROL_DB:-boutique_pos_control}
      TZ: ${TZ:-America/Tegucigalpa}
    volumes:
      # Una carpeta normal del servidor: ahí quedan los archivos cifrados para copiarlos fuera del equipo.
      - ${BACKUP_PATH:-./backups}:/backups
      # Las fotos de los productos, solo lectura: se archivan (photos-….tar.enc) junto al volcado de cada negocio.
      - uploads:/photos:ro
    healthcheck:
      # "Sano" = hay un respaldo de las últimas 26 horas (y, con varios negocios, también de la base central). Si los
      # respaldos se detienen, `docker compose ps` lo muestra.
      test:
        - CMD-SHELL
        - >-
          find /backups -maxdepth 1 -name 'boutique-*.dump.enc' -mmin -1560 | grep -q .
          && { [ "$${TENANCY_MODE:-single}" != multi ]
          || find /backups -maxdepth 1 -name 'control-*.dump.enc' -mmin -1560 | grep -q . ; }
      interval: 1h
      timeout: 10s
      retries: 1
      start_period: 10m
    logging: *logging

  # OPCIONAL, apagado por omisión (`dc --profile pgbouncer up -d`). Se evaluó y no se recomienda salvo que un Postgres
  # administrado limite las conexiones: con un rol por negocio no pone un tope global y cuesta rendimiento (docs/RUNBOOK.md §17).
  pgbouncer:
    profiles: ["pgbouncer"]
    build: ./docker/pgbouncer
    image: boutique-pos-pgbouncer:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGB_HOST: db
      PGB_PORT: 5432
      # La de la cuenta `pgbouncer` (pnpm pgbouncer:setup). Vacía, el servicio se niega a arrancar.
      PGB_AUTH_PASSWORD: ${PGB_AUTH_PASSWORD:-}
      PGB_POOL_SIZE: ${PGB_POOL_SIZE:-4}
      PGB_SERVER_IDLE_TIMEOUT: ${PGB_SERVER_IDLE_TIMEOUT:-1}
      PGB_MAX_CLIENT_CONN: ${PGB_MAX_CLIENT_CONN:-4000}
    expose:
      - "6432"
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Una sola tienda: su dominio. Varios negocios (TENANCY_MODE=multi): el dominio del panel (PLATFORM_HOST).
      DOMAIN: ${DOMAIN:?define DOMAIN en .env.production}
    volumes:
      # Una sola tienda usa ./Caddyfile; varios negocios, ./Caddyfile.multi (CADDYFILE=./Caddyfile.multi en .env.production).
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
