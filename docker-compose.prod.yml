# Producción: base de datos + app + Caddy (HTTPS). Siempre con el archivo de variables:
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
# Plantilla del archivo: .env.production.example. La contraseña de la base debe ser apta para una URL (p. ej. `openssl rand -hex 24`).
name: boutique-pos-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?define POSTGRES_USER en .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-boutique_pos}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: boutique-pos:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-boutique_pos}?schema=public
    expose:
      - "3000"
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?define DOMAIN en .env.production}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
